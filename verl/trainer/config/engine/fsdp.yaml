# Target class for this configuration
_target_: verl.workers.config.FSDPEngineConfig

# policy for wrapping the model
wrap_policy:

  # Minimum number of parameters to trigger wrapping a layer with FSDP
  min_num_params: 0

# Whether to offload model parameters to CPU (trades speed for memory)
# Note that this differs from the offload_policy in FSDP
param_offload: false

# Whether to offload optimizer state to CPU
# Note that this differs from the offload_policy in FSDP
optimizer_offload: false

# Only for FSDP2: offload param/grad/optimizer during train
offload_policy: false

# Reshard after forward pass to reduce memory footprint
# For FSDP1, `false` enables `ShardingStrategy.SHARD_GRAD_OP`
reshard_after_forward: true

# Number of GPUs in each FSDP shard group; -1 means auto
fsdp_size: -1

# Only for FSDP1: FSDP1 configuration, prefetch the next forward-pass all-gather
# before the current forward computation.
forward_prefetch: False

# model dtype of fsdp
model_dtype: fp32

# Whether to use original parameters in fsdp. Only avaiable in fsdp1
use_orig_params: false

# Random seed for reproducibility.
seed: 42

# Whether to enable full determinism for distributed training, only for debugging.
full_determinism: false

# ulysses sequence parallel size
ulysses_sequence_parallel_size: 1

# Whether to use entropy_from_logits_with_chunking in fsdp.
entropy_from_logits_with_chunking: false

# Whether to use torch compile in fsdp.
use_torch_compile: true

# Whether to use entropy checkpointing in fsdp.
entropy_checkpointing: false

# Whether to use forward only in fsdp.
forward_only: false

# fsdp or fsdp2
strategy: fsdp

# Mixed precision training param dtype
dtype: bfloat16 # ["bfloat16", "float16"]

# QAT (Quantization-Aware Training) configuration.
#
# MXFP example (FSDP2):
#   strategy: fsdp2
#   qat.enable: true
#   qat.mode: mxfp_w8a8
#   qat.group_size: 32
#   qat.quant_backend: npu
#   qat.fake_quant_targets: [Fprop, Dgrad, Wgrad]
#   qat.backward_reduction_axis_fake_quant: true
#   qat.rotation_enable: true
#   qat.rotation_targets: [Fprop, Dgrad, Wgrad]
#   qat.experts.enable: true
# The MXFP expert path is applied at the packed NPU grouped-matmul boundary.
qat:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.QATEngineConfig

  # Whether to enable QAT
  enable: false

  # Quantization mode: "w4a16" (legacy weight-only), or "mxfp_w8a8", "mxfp_w4a8", "mxfp_w4a4".
  mode: "w4a16"

  # Quantization group size. MXFP requires 32; legacy NVFP4 uses 16.
  group_size: 16

  # Patterns to ignore (e.g., lm_head, embed_tokens)
  ignore_patterns:

    - "lm_head"
    - "embed_tokens"
    - "re:.*mlp.gate$"

  # Activation observer for W4A4 mode
  activation_observer: "static_minmax"

  # Path to vLLM quantization config JSON file
  quantization_config_path: null

  # MXFP quantization backend: "npu" for MXFP8 on Ascend, "torch" for MXFP4 or CPU tests.
  quant_backend: "npu"

  # MXFP rounding mode: rint, round, random, or hash (torch backend only for stochastic modes).
  rounding_mode: "rint"

  # MXFP pseudo-quantization locations. Valid values are Fprop, Dgrad, and Wgrad.
  fake_quant_targets: [Fprop]

  # Cache a separately quantized operand for the backward reduction axis when true.
  backward_reduction_axis_fake_quant: false

  # Enable deterministic block-local rotation before the selected MXFP transforms.
  rotation_enable: false

  # Rotation locations. Valid values are Fprop, Dgrad, and Wgrad.
  rotation_targets: [Fprop]

  # Rotation block size. MXFP experiments normally keep this equal to group_size (32).
  rotation_block_size: 32

  # Seed for the deterministic block rotation matrix.
  rotation_seed: 0

  # Collect one QDQ error summary per training step/layer/module/target/operand.
  probe_quant_error: false
  # Output file prefix (.json and .html are written); directories get default basenames.
  probe_quant_error_output_path: null
  # Keep matmul operands high precision while probing; QDQ values are used only for error metrics.
  probe_quant_error_use_high_precision: true

  # Optional per-layer fallback policy. null keeps all eligible layers on the configured MXFP path.
  fallback_layers: null

  # Packed MoE expert QAT. This is consumed by the FSDP2 NPU grouped-matmul path.
  experts:

    # Replace the packed expert grouped matmuls with MXFP QAT grouped matmuls.
    enable: false

    # Current expert implementation. Keep grouped_matmul for the Ascend NPU path.
    npu_backend: "grouped_matmul"
